name: Paradata Canonical Drift
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@733f464315384490bc628506286a6e456e7af894  # v1
    with:
      hub-ref: 733f464315384490bc628506286a6e456e7af894
      # atrium-project#72 B: api_util/teitok_read.py, bbox_scale.py, flexiconv_convert.py and their
      # fixtures are nlp-enrich's, pinned by tests/test_vendored_teitok_parity.py; text_formats.py
      # (the ODT/ODS/XLSX/RTF reader, atrium-digital-convert#2 W2) is ocr-postprocess's, pinned by
      # tests/test_vendored_reader_parity.py. decision_client.py (the decision-model client of
      # tools/decide_documents.py, atrium-project#83) is page-classification's, pinned by
      # tests/test_vendored_decision_parity.py. The reusable checks each owner out at the commit
      # its pin file adopted (ADOPTED["commit"]) and compares the copies with it byte for byte, so
      # a push to the owner never turns this repository red; how far the owner has moved on since
      # (its `test` head) is a summary, not a failure (atrium-project#82 B).
      vendored-from: atrium-nlp-enrich atrium-ocr-postprocess atrium-page-classification