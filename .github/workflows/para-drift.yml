name: Paradata Canonical Drift
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@v1
    with:
      # atrium-project#72 B: api_util/teitok_read.py, bbox_scale.py, flexiconv_convert.py and their
      # fixtures are nlp-enrich's, pinned by tests/test_vendored_teitok_parity.py; the reusable
      # compares them with nlp-enrich's `test` head, so a copy that falls behind turns red here.
      vendored-from: atrium-nlp-enrich