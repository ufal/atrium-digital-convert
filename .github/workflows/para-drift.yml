name: Paradata Canonical Drift
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@439488bb285d48eec099195528f9d1772f3b1119  # v1
    with:
      hub-ref: 439488bb285d48eec099195528f9d1772f3b1119
      # atrium-project#72 B: api_util/teitok_read.py, bbox_scale.py, flexiconv_convert.py and their
      # fixtures are nlp-enrich's, pinned by tests/test_vendored_teitok_parity.py; text_formats.py
      # (the ODT/ODS/XLSX/RTF reader, atrium-digital-convert#2 W2) is ocr-postprocess's, pinned by
      # tests/test_vendored_reader_parity.py. The reusable compares each with its owner's `test`
      # head, so a copy that falls behind turns red here.
      vendored-from: atrium-nlp-enrich atrium-ocr-postprocess