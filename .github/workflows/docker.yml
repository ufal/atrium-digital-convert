name: Docker Build & Publish

on:
  push:
    branches: [test, main]
    tags: ['v*']
  pull_request:
    branches: [test, main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      # security-events:write is required because docker-tool.reusable.yml's
      # build-and-push job uploads the post-publish Trivy SARIF. A reusable
      # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes
      # GitHub reject the whole file at parse time with "requesting
      # 'security-events: write', but is only allowed 'security-events: none'"
      # — a startup_failure, not a step failure (#18). Same grant security.yml
      # already makes for its own SARIF upload. Not an escalation: this job
      # already holds packages: write.
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@v1
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      # The images publish under THIS repository's name since v1.1.0-beta (#1): v1.0.0-beta
      # still pushed to ghcr.io/ufal/atrium-llm-enrich-*, a package this repository cannot
      # write (atrium-project#71, status of 2026-10-01, point 3). The new packages are private
      # on creation: grant ufal/atrium-project read access for the hub's digital E2E.
      image-name: ufal/atrium-digital-convert
      apt-packages: ""
      pre-install-torch: ""
      # requirements-test.txt is listed because THIS job is the one that runs
      # `pytest -m "not slow" --cov` (docker-tool.reusable.yml), and requirements_digital.txt
      # because the converter's readers are what most tests exercise. The DOC/XLS tests run
      # against a fake `soffice`, so the job needs no LibreOffice; the images carry the real one.
      requirements: "requirements.txt requirements_digital.txt requirements-test.txt"
      hf-model-cache: false
      # "base" is deliberately NOT listed: it has no ENTRYPOINT and is not meant to be run
      # standalone. `digital-docling` is a local, opt-in build (a torch image of several GB).
      #   digital — the converter CLI (api_util/digital_to_json.py): published, never pinned;
      #             the hub's e2e-digital-smoke.yml runs it.
      #   api     — THE production image (atrium-project#72): POST /reformat, POST /describe.
      build-targets: '["digital", "api"]'
      # issue #55: the api image is container-smoked: docker run -> wait for HEALTHCHECK
      # healthy -> GET /health and /ready -> docker stop with a clean-exit assertion.
      probe-targets: '["api"]'
      # atrium-project#72: `api` is this repository's production image, its first-party files
      # declared in .github/production-image.json and checked by workflow-lint.
